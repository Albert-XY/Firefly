<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="默认封面">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1416"/>
      <stop offset="100%" stop-color="#122022"/>
    </linearGradient>
    <radialGradient id="g1" cx="22%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#2fd3a8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2fd3a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="82%" cy="26%" r="50%">
      <stop offset="0%" stop-color="#3f8ce0" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#3f8ce0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="62%" cy="88%" r="55%">
      <stop offset="0%" stop-color="#28b8a0" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#28b8a0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>
  <rect width="1200" height="630" fill="url(#g3)"/>

  <!-- 前哨站标记：同心弧 + 扫描线，呼应站点意象 -->
  <g opacity="0.5" fill="none" stroke="#2fd3a8" stroke-width="1.4">
    <circle cx="600" cy="315" r="70" stroke-opacity="0.5"/>
    <circle cx="600" cy="315" r="128" stroke-opacity="0.3"/>
    <circle cx="600" cy="315" r="186" stroke-opacity="0.16"/>
    <path d="M600 315 L840 195" stroke-opacity="0.75"/>
  </g>
  <circle cx="600" cy="315" r="6" fill="#2fd3a8"/>
  <circle cx="742" cy="244" r="5" fill="#2fd3a8" fill-opacity="0.85"/>
  <circle cx="470" cy="392" r="4" fill="#2fd3a8" fill-opacity="0.6"/>

  <text x="64" y="558" font-family="ui-monospace, Consolas, monospace" font-size="22" fill="#2fd3a8" fill-opacity="0.85">OUTPOST</text>
  <text x="64" y="592" font-family="ui-monospace, Consolas, monospace" font-size="16" fill="#ffffff" fill-opacity="0.45">aIbert的前哨站</text>
</svg>
